apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incident-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yamunaboddapati/incident-tracker-gitops.git
    targetRevision: main
    path: apps/incident-tracker
  destination:
    server: https://kubernetes.default.svc
    namespace: incident-tracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
